<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d4fc2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Química Ind.">
  <title>Química Industrial · Estudio</title>
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <!-- manifest.webmanifest (instalar como app) se añade desde js/app.js solo en Cloudflare: con file:// daría error. -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="sin-sesion">
  <header class="barra">
    <a href="#/estudio" class="logo"><span aria-hidden="true">⚗️</span> <span>Química Industrial</span></a>
    <!-- En pantallas anchas va en la barra de arriba; en el móvil, fija abajo (css/estilos.css). -->
    <nav class="nav-principal" aria-label="Secciones">
      <a href="#/estudio" data-nav="estudio"><span class="ico" aria-hidden="true">🔬</span>Estudio</a>
      <a href="#/examen" data-nav="examen"><span class="ico" aria-hidden="true">⏱️</span>Examen</a>
      <a href="#/test" data-nav="test"><span class="ico" aria-hidden="true">🧪</span>Test</a>
      <a href="#/ajustes" data-nav="ajustes"><span class="ico" aria-hidden="true">⚙️</span>Ajustes</a>
    </nav>
    <span id="usuario-barra" class="acciones"></span>
  </header>
  <main id="app"></main>

  <!-- Orden: utilidades → usuarios → registro → unidades → app. Para añadir una UD, crea datos/<modulo>_udN.js y añádelo aquí. -->
  <script src="js/utilidades.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="datos/registro.js"></script>
  <script src="datos/novedades.js"></script>
  <script src="datos/tsf_ud3.js"></script>
  <script src="datos/tsf_ud4.js"></script>
  <script src="datos/tsf_ud5.js"></script>
  <script src="datos/tsf_ud6.js"></script>
  <script src="datos/tsf_ud7.js"></script>
  <script src="datos/mei_ud4.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

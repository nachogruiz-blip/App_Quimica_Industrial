# Comprobación automática en cada push y pull request: tests de la app (node tests/comprobar.js) y tipos de los datos.
# tests/derechos.js no se ejecuta aquí: necesita el repo privado de materiales (hazlo en local antes de publicar).
name: Comprobar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Solo para la CI: la app no tiene dependencias (no hay package.json). Versiones fijas para que sea repetible.
      - name: Instalar Playwright y TypeScript
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 typescript@5.6.3
          npx playwright install --with-deps chromium
      - name: Tipos de los datos (jsconfig.json + tipos.d.ts)
        run: npx tsc -p jsconfig.json
      - name: Tests de la app
        run: node tests/comprobar.js
